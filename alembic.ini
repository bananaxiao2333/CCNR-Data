[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os
# 实际 URL 由 alembic/env.py 从 CCNR_DATA_DATABASE_URL / DB_FILE 覆盖。
sqlalchemy.url = sqlite+pysqlite:///var/ccnr-data.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
