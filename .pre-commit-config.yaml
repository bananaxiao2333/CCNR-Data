# 本地门禁：pre-commit install 后每次提交自动跑。
# 与 CI 的 scripts/check.sh 同源（同一套工具、同一套配置）。
default_install_hook_types: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast            # 语法错误
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
        exclude: \.(md|sql)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: no-raw-sql
        name: no raw SQL outside db.py
        entry: ./scripts/check-no-raw-sql.sh
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy
        name: mypy (uv run)
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: pytest (uv run)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
